<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PeakPower Trading Platform — Specification</title>
<style>
:root {
  --bg:#f4f6f9; --panel:#ffffff; --panel2:#f8fafc; --border:#e2e8f0; --border2:#cbd5e1;
  --text:#0f172a; --muted:#5b6b7f; --faint:#94a3b8;
  --accent:#0d9488; --accent-fg:#ffffff; --accent-bg:#ccfbf1; --accent-dk:#0f766e;
  --amber:#b45309; --amber-bg:#fef3c7; --danger:#b91c1c; --danger-bg:#fee2e2;
  --green:#15803d; --green-bg:#dcfce7; --indigo:#4338ca; --indigo-bg:#e0e7ff;
  --nav:#0f2b33; --nav-fg:#cbd5e1; --nav-active:#14b8a6;
  --code-bg:#f1f5f9;
  --shadow:0 1px 2px rgba(15,23,42,.06), 0 4px 16px rgba(15,23,42,.05);
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
}
:root[data-theme="dark"] {
  --bg:#0b1116; --panel:#131c24; --panel2:#0f1720; --border:#22303c; --border2:#33455480;
  --text:#e6edf3; --muted:#9fb0c0; --faint:#6b7f92;
  --accent:#2dd4bf; --accent-fg:#04201c; --accent-bg:#123b38; --accent-dk:#5eead4;
  --amber:#fbbf24; --amber-bg:#3a2c0d; --danger:#f87171; --danger-bg:#3d1618;
  --green:#4ade80; --green-bg:#0f2e1c; --indigo:#a5b4fc; --indigo-bg:#1e1b4b;
  --nav:#08131a; --nav-fg:#94a3b8; --nav-active:#2dd4bf;
  --code-bg:#0d151c;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 22px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--sans);
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
a{color:var(--accent-dk); text-decoration:none}
a:hover{text-decoration:underline}
:root[data-theme="dark"] a{color:var(--accent)}

/* ── layout ─────────────────────────────────────────────────────────── */
.app{display:grid; grid-template-columns:286px 1fr; min-height:100vh}

.sidebar{
  background:var(--nav); color:var(--nav-fg); position:sticky; top:0; height:100vh;
  overflow-y:auto; padding:0 0 28px; display:flex; flex-direction:column;
}
.brand{display:flex; align-items:center; gap:11px; padding:20px 22px 16px; position:sticky; top:0; background:var(--nav); z-index:2}
.brand-mark{width:30px;height:30px;border-radius:50%;background:var(--nav-active);display:grid;place-items:center;flex:0 0 auto}
.brand-mark svg{width:15px;height:15px}
.brand-t{font-weight:750;color:#fff;font-size:15.5px;line-height:1.15;letter-spacing:-.01em}
.brand-s{font-size:10.5px;color:var(--nav-active);font-weight:650;letter-spacing:.04em;text-transform:uppercase}

.navsearch{padding:0 16px 12px}
.navsearch input{
  width:100%; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
  color:#e2e8f0; border-radius:8px; padding:8px 11px; font:inherit; font-size:13px;
}
.navsearch input::placeholder{color:#64748b}
.navsearch input:focus{outline:none; border-color:var(--nav-active); background:rgba(255,255,255,.09)}

nav{padding:0 12px}
.navgroup{margin-bottom:6px}
.navgroup-h{
  display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:750;letter-spacing:.07em;
  text-transform:uppercase;color:#5b7280;padding:12px 10px 6px;
}
.navlink{
  display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;
  color:var(--nav-fg);font-size:13px;line-height:1.35;cursor:pointer;text-decoration:none;
  border-left:3px solid transparent;
}
.navlink:hover{background:rgba(255,255,255,.055);color:#fff;text-decoration:none}
.navlink.active{background:rgba(45,212,191,.15);color:#fff;font-weight:600;border-left-color:var(--nav-active)}
.navlink .n{color:#5b7280;font-size:11px;font-variant-numeric:tabular-nums;min-width:20px}
.navlink.active .n{color:var(--nav-active)}
.navfoot{margin-top:auto;padding:16px 22px 0;font-size:10.5px;color:#516274;line-height:1.6}

main{min-width:0; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--border);
  padding:11px 34px; display:flex; align-items:center; gap:14px;
}
.crumb{font-size:12.5px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb b{color:var(--text);font-weight:650}
.tbtn{
  border:1px solid var(--border2); background:var(--panel); color:var(--text);
  border-radius:7px; padding:5px 11px; font:inherit; font-size:12.5px; cursor:pointer;
}
.tbtn:hover{border-color:var(--accent); color:var(--accent-dk)}
.content{padding:30px 34px 90px; max-width:1080px; width:100%}
.content.wide{max-width:1500px}

/* ── typography ─────────────────────────────────────────────────────── */
.doc h1{font-size:31px;line-height:1.2;letter-spacing:-.02em;margin:0 0 18px;font-weight:760}
.doc h2{font-size:21px;margin:44px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border);font-weight:700;letter-spacing:-.01em}
.doc h3{font-size:16.5px;margin:30px 0 10px;font-weight:700}
.doc h4{font-size:14px;margin:22px 0 8px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.doc p{margin:0 0 14px}
.doc ul,.doc ol{margin:0 0 14px;padding-left:22px}
.doc li{margin:4px 0}
.doc li>p{margin:0 0 6px}
.doc hr{border:none;border-top:1px solid var(--border);margin:34px 0}
.doc strong{font-weight:670;color:var(--text)}
.doc code{
  font-family:var(--mono); font-size:.855em; background:var(--code-bg);
  padding:.13em .38em; border-radius:4px; border:1px solid var(--border);
}
.doc pre{
  background:var(--code-bg); border:1px solid var(--border); border-radius:10px;
  padding:15px 17px; overflow-x:auto; margin:0 0 18px; font-size:12.5px; line-height:1.55;
}
.doc pre code{background:none;border:none;padding:0;font-size:inherit}
.doc blockquote{
  margin:0 0 18px; padding:13px 18px; border-left:3px solid var(--accent);
  background:var(--accent-bg); border-radius:0 9px 9px 0; color:var(--text);
}
.doc blockquote p:last-child{margin-bottom:0}
.doc blockquote strong{color:var(--accent-dk)}
:root[data-theme="dark"] .doc blockquote strong{color:var(--accent)}

.tablewrap{overflow-x:auto; margin:0 0 20px; border:1px solid var(--border); border-radius:10px; background:var(--panel)}
.doc table{border-collapse:collapse; width:100%; font-size:13px}
.doc th{
  text-align:left; padding:9px 13px; background:var(--panel2); font-weight:700;
  font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);
  border-bottom:1px solid var(--border); white-space:nowrap;
}
.doc td{padding:9px 13px; border-bottom:1px solid var(--border); vertical-align:top}
.doc tr:last-child td{border-bottom:none}
.doc tbody tr:hover{background:var(--panel2)}

/* ── diagrams ───────────────────────────────────────────────────────── */
.mermaid{
  background:var(--panel); border:1px solid var(--border); border-radius:11px;
  padding:20px; margin:0 0 20px; overflow-x:auto; text-align:center;
  position:relative; cursor:zoom-in;
}
.mermaid svg{max-width:100%;height:auto}
.mermaid:hover{border-color:var(--accent)}
.dgm-bar{
  position:absolute; top:8px; right:8px; display:flex; gap:5px;
  opacity:0; transition:opacity .12s; z-index:2;
}
.mermaid:hover .dgm-bar, .mermaid:focus-within .dgm-bar{opacity:1}
.dgm-btn{
  border:1px solid var(--border2); background:var(--panel); color:var(--muted);
  border-radius:6px; padding:3px 9px; font:inherit; font-size:11.5px; font-weight:600;
  cursor:pointer; line-height:1.6;
}
.dgm-btn:hover{border-color:var(--accent); color:var(--accent-dk); background:var(--panel2)}
:root[data-theme="dark"] .dgm-btn:hover{color:var(--accent)}
.mermaid.dgm-failed{border-color:var(--danger); cursor:default}
.dgm-err{
  text-align:left; background:var(--danger-bg); color:var(--danger);
  border-radius:7px; padding:9px 12px; margin:0 0 12px; font-size:12.5px;
}
.dgm-hint{
  position:absolute; bottom:6px; right:12px; font-size:10.5px; color:var(--faint);
  opacity:0; transition:opacity .12s; pointer-events:none;
}
.mermaid:hover .dgm-hint{opacity:1}

/* ── full-screen viewer (diagrams + mockups) ────────────────────────── */
.viewer{position:fixed; inset:0; z-index:200; display:none; flex-direction:column; background:#0a1117}
.viewer.on{display:flex}
:root[data-theme="light"] .viewer{background:#1b2530}
.v-bar{
  display:flex; align-items:center; gap:14px; padding:9px 16px; flex:0 0 auto;
  background:rgba(10,17,23,.92); border-bottom:1px solid rgba(255,255,255,.09);
}
.v-title{min-width:0; flex:1}
.v-title b{display:block; color:#f1f5f9; font-size:14px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.v-title span{display:block; color:#7d90a4; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.v-tools{display:flex; align-items:center; gap:6px; flex:0 0 auto; flex-wrap:wrap; justify-content:flex-end}
.v-btn{
  border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.07); color:#e2e8f0;
  border-radius:7px; padding:6px 11px; font:inherit; font-size:12.5px; font-weight:600;
  cursor:pointer; white-space:nowrap;
}
.v-btn:hover{background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.3)}
.v-btn.icon{padding:6px 0; width:32px; text-align:center; font-size:15px; line-height:1.1}
.v-btn.primary{background:var(--accent); border-color:var(--accent); color:#04201c}
.v-btn.primary:hover{filter:brightness(1.1)}
.v-btn[disabled]{opacity:.5; cursor:default}
.v-zoom{color:#cbd5e1; font-size:12px; font-variant-numeric:tabular-nums; min-width:52px; text-align:center; font-family:var(--mono)}
.v-sep{width:1px; height:22px; background:rgba(255,255,255,.14); margin:0 3px}
.v-stage{
  flex:1 1 auto; overflow:hidden; position:relative; cursor:grab;
  background:
    linear-gradient(45deg, rgba(255,255,255,.022) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.022) 75%),
    linear-gradient(45deg, rgba(255,255,255,.022) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.022) 75%);
  background-size:26px 26px; background-position:0 0, 13px 13px;
}
.v-stage.grabbing{cursor:grabbing}
.v-canvas{position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform}
.v-canvas svg{display:block; border-radius:8px; box-shadow:0 18px 60px rgba(0,0,0,.55)}
.v-foot{
  flex:0 0 auto; padding:7px 16px; background:rgba(10,17,23,.92);
  border-top:1px solid rgba(255,255,255,.09); color:#7d90a4; font-size:11.5px;
  display:flex; justify-content:space-between; gap:12px;
}
.v-foot kbd{
  background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16); border-radius:4px;
  padding:1px 5px; font-family:var(--mono); font-size:10.5px; color:#cbd5e1;
}
.v-toast{
  position:fixed; left:50%; bottom:64px; transform:translateX(-50%);
  background:var(--accent); color:#04201c; padding:9px 18px; border-radius:8px;
  font-size:13px; font-weight:650; z-index:210; opacity:0; pointer-events:none;
  transition:opacity .18s;
}
.v-toast.on{opacity:1}

/* ── reference chips ────────────────────────────────────────────────── */
.chip{
  display:inline-block; font-family:var(--mono); font-size:11.5px; font-weight:650;
  padding:1px 6px; border-radius:5px; border:1px solid; white-space:nowrap; text-decoration:none;
  line-height:1.5; vertical-align:baseline;
}
.chip:hover{text-decoration:none; filter:brightness(.96)}
.chip-oq{background:var(--amber-bg); color:var(--amber); border-color:color-mix(in srgb,var(--amber) 35%,transparent)}
.chip-dec{background:var(--green-bg); color:var(--green); border-color:color-mix(in srgb,var(--green) 32%,transparent)}
.chip-as{background:var(--indigo-bg); color:var(--indigo); border-color:color-mix(in srgb,var(--indigo) 32%,transparent)}
.chip-f{background:var(--accent-bg); color:var(--accent-dk); border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
:root[data-theme="dark"] .chip-f{color:var(--accent)}
.chip-nfr{background:var(--panel2); color:var(--muted); border-color:var(--border2)}

/* ── cards & dashboards ─────────────────────────────────────────────── */
.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
.card{
  background:var(--panel); border:1px solid var(--border); border-radius:12px;
  padding:17px 19px; box-shadow:var(--shadow);
}
.card.link{cursor:pointer; transition:border-color .12s, transform .12s}
.card.link:hover{border-color:var(--accent); transform:translateY(-1px)}
.card h3{margin:0 0 5px; font-size:15px; font-weight:700}
.card p{margin:0; font-size:12.8px; color:var(--muted); line-height:1.55}
.stat{text-align:left}
.stat .v{font-size:29px; font-weight:760; letter-spacing:-.025em; line-height:1.1}
.stat .l{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:6px}
.stat .s{font-size:11.5px; color:var(--faint); margin-top:3px}

.hero{
  background:linear-gradient(135deg, #0f2b33 0%, #164e52 55%, #0d9488 190%);
  color:#fff; border-radius:16px; padding:34px 36px; margin-bottom:22px;
}
.hero h1{margin:0 0 10px; font-size:33px; letter-spacing:-.025em; font-weight:760; color:#fff}
.hero p{margin:0; max-width:74ch; color:#c3dedd; font-size:15px; line-height:1.65}
.hero .tags{margin-top:18px; display:flex; gap:8px; flex-wrap:wrap}
.hero .tag{background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.16); padding:4px 11px; border-radius:20px; font-size:11.5px; font-weight:600}

.badge{
  display:inline-block; padding:2px 8px; border-radius:20px; font-size:10.5px;
  font-weight:700; letter-spacing:.02em; white-space:nowrap; border:1px solid;
}
.b-must{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.b-should{background:var(--amber-bg);color:var(--amber);border-color:transparent}
.b-could{background:var(--panel2);color:var(--muted);border-color:var(--border2)}
.b-p1{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.b-p2{background:var(--amber-bg);color:var(--amber);border-color:transparent}
.b-p3{background:var(--panel2);color:var(--muted);border-color:var(--border2)}
.b-ok{background:var(--green-bg);color:var(--green);border-color:transparent}
.b-in{background:var(--indigo-bg);color:var(--indigo);border-color:transparent}

.filters{display:flex; gap:8px; flex-wrap:wrap; margin:0 0 18px; align-items:center}
.fbtn{
  border:1px solid var(--border2); background:var(--panel); color:var(--muted);
  border-radius:20px; padding:5px 13px; font:inherit; font-size:12.5px; cursor:pointer; font-weight:600;
}
.fbtn:hover{border-color:var(--accent)}
.fbtn.on{background:var(--accent); border-color:var(--accent); color:var(--accent-fg)}

/* ── mockups ────────────────────────────────────────────────────────── */
.mockgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(430px,1fr)); gap:18px}
.mock{background:var(--panel); border:1px solid var(--border); border-radius:12px; overflow:hidden; box-shadow:var(--shadow); cursor:zoom-in}
.mock:hover{border-color:var(--accent)}
.mock svg{width:100%; height:auto; display:block; border-bottom:1px solid var(--border)}
.mock .cap{padding:11px 15px}
.mock .cap b{font-size:13.5px; display:block}
.mock .cap span{font-size:11.5px; color:var(--faint); font-family:var(--mono)}
.mock{position:relative}
.mock .dgm-bar{top:10px; right:10px}
.mock:hover .dgm-bar{opacity:1}

/* ── search ─────────────────────────────────────────────────────────── */
.searchres{margin-top:6px}
.sres{display:block; padding:13px 16px; border:1px solid var(--border); border-radius:10px; background:var(--panel); margin-bottom:9px; cursor:pointer}
.sres:hover{border-color:var(--accent); text-decoration:none}
.sres .st{font-weight:660; font-size:14px; color:var(--text)}
.sres .sc{font-size:11px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em; font-weight:700; margin-bottom:3px}
.sres .sn{font-size:12.8px; color:var(--muted); margin-top:5px; line-height:1.55}
.sres mark{background:var(--amber-bg); color:var(--amber); padding:0 2px; border-radius:3px; font-weight:650}

/* ── toc ────────────────────────────────────────────────────────────── */
.docwrap{display:grid; grid-template-columns:1fr 214px; gap:38px; align-items:start}
.toc{position:sticky; top:74px; font-size:12.5px; max-height:calc(100vh - 110px); overflow-y:auto}
.toc-h{font-size:10.5px; font-weight:750; text-transform:uppercase; letter-spacing:.07em; color:var(--faint); margin-bottom:9px}
.toc a{display:block; padding:3px 0 3px 11px; color:var(--muted); border-left:2px solid var(--border); line-height:1.4}
.toc a:hover{color:var(--accent-dk); text-decoration:none; border-left-color:var(--accent)}
.toc a.h3{padding-left:22px; font-size:12px; color:var(--faint)}
.pager{display:flex; justify-content:space-between; gap:14px; margin-top:46px; padding-top:22px; border-top:1px solid var(--border)}
.pager a{
  flex:1; padding:13px 16px; border:1px solid var(--border); border-radius:10px;
  background:var(--panel); font-size:13.5px; font-weight:640;
}
.pager a:hover{border-color:var(--accent); text-decoration:none}
.pager a.next{text-align:right}
.pager span{display:block; font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.06em; font-weight:700; margin-bottom:2px}

@media (max-width:1080px){ .docwrap{grid-template-columns:1fr} .toc{display:none} }
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;max-height:none}
  .content{padding:20px 18px 60px}
  .topbar{padding:10px 18px}
  .mockgrid{grid-template-columns:1fr}
}
@media print{
  .sidebar,.topbar,.toc,.pager{display:none}
  .app{grid-template-columns:1fr}
  .content{max-width:none;padding:0}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="#0f2b33"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
      </div>
      <div>
        <div class="brand-t">PeakPower</div>
        <div class="brand-s">Specification</div>
      </div>
    </div>
    <div class="navsearch"><input id="q" type="search" placeholder="Search  ⌘K" autocomplete="off"></div>
    <nav id="nav"></nav>
    <div class="navfoot" id="navfoot"></div>
  </aside>

  <main>
    <div class="topbar">
      <div class="crumb" id="crumb"></div>
      <button class="tbtn" id="printBtn">Print</button>
      <button class="tbtn" id="themeBtn">Dark</button>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Diagram viewer">
  <div class="v-bar">
    <div class="v-title"><b id="vTitle"></b><span id="vSub"></span></div>
    <div class="v-tools">
      <button class="v-btn icon" id="vOut"  title="Zoom out (−)" aria-label="Zoom out">−</button>
      <span class="v-zoom" id="vZoom">100%</span>
      <button class="v-btn icon" id="vIn"   title="Zoom in (+)" aria-label="Zoom in">+</button>
      <button class="v-btn"      id="vFit"  title="Fit to screen (0)">Fit</button>
      <button class="v-btn"      id="vOne"  title="Actual size (1)">1:1</button>
      <span class="v-sep"></span>
      <button class="v-btn primary" id="vPng">Download PNG</button>
      <button class="v-btn"         id="vSvg">SVG</button>
      <button class="v-btn"         id="vTab">Open in tab ↗</button>
      <span class="v-sep"></span>
      <button class="v-btn" id="vClose" title="Close (Esc)">Close ✕</button>
    </div>
  </div>
  <div class="v-stage" id="vStage"><div class="v-canvas" id="vCanvas"></div></div>
  <div class="v-foot">
    <span>Scroll to zoom · drag to pan · double-click to fit</span>
    <span><kbd>+</kbd> <kbd>−</kbd> zoom &nbsp; <kbd>0</kbd> fit &nbsp; <kbd>1</kbd> actual &nbsp; <kbd>Esc</kbd> close</span>
  </div>
</div>

<script src="vendor/marked.min.js"></script>
<script src="vendor/mermaid.min.js"></script>
<script>
(function () {
'use strict';
const D = window.SPEC_CONTENT;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

/* ── views registered as pseudo-docs ───────────────────────────────── */
const VIEWS = [
  { id: '@home',      section:'home', title:'Overview',          nav:'Overview' },
  { id: '@features',  section:'features', title:'Feature matrix', nav:'Feature matrix' },
  { id: '@questions', section:'delivery', title:'Open questions',  nav:'Open questions' },
  { id: '@risks',     section:'delivery', title:'Risk register',   nav:'Risk register' },
  { id: '@decisions', section:'overview', title:'Decisions & assumptions', nav:'Decision log' },
  { id: '@mockups',   section:'mockups', title:'Mockup gallery',   nav:'Gallery' },
];

const docById = Object.fromEntries(D.docs.map((d) => [d.id, d]));

/** READMEs lead their section; everything else sorts by filename. */
function docSort(a, b) {
  const rank = (d) => (/README\.md$/.test(d.path) ? 0 : 1);
  return rank(a) - rank(b) || a.path.localeCompare(b.path);
}

/* ── markdown ──────────────────────────────────────────────────────── */
const slug = (s) => s.toLowerCase().replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-');
const renderer = new marked.Renderer();
renderer.code = ({ text, lang }) => (lang === 'mermaid'
  ? '<pre class="mermaid">' + esc(text) + '</pre>'
  : '<pre><code>' + esc(text) + '</code></pre>');
renderer.table = (t) => {
  const head = '<thead><tr>' + t.header.map((c) => '<th>' + inline(c.text) + '</th>').join('') + '</tr></thead>';
  const body = '<tbody>' + t.rows.map((r) => '<tr>' + r.map((c) => '<td>' + inline(c.text) + '</td>').join('') + '</tr>').join('') + '</tbody>';
  return '<div class="tablewrap"><table>' + head + body + '</table></div>';
};
renderer.heading = ({ text, depth }) => {
  const t = inline(text);
  const id = slug(text);
  return '<h' + depth + ' id="' + id + '">' + t + '</h' + depth + '>';
};
function inline(md) { return marked.parseInline(md, { renderer }); }
marked.use({ renderer, gfm: true, breaks: false });

/** Rewrite relative .md links to hash routes, resolved against the doc's folder. */
function resolveLinks(root, dir) {
  root.querySelectorAll('a[href]').forEach((a) => {
    const href = a.getAttribute('href');
    if (!href || /^(https?:|mailto:|#)/.test(href)) return;
    const [p, frag] = href.split('#');
    const parts = (dir === '.' ? [] : dir.split('/')).concat(p.split('/'));
    const out = [];
    for (const seg of parts) {
      if (seg === '' || seg === '.') continue;
      if (seg === '..') out.pop(); else out.push(seg);
    }
    let target = out.join('/');
    if (/\.md$/.test(target)) {
      const id = target.replace(/\.md$/, '');
      if (docById[id]) { a.setAttribute('href', '#/' + id + (frag ? '#' + frag : '')); return; }
    }
    if (/\.svg$/.test(target)) {
      const name = target.split('/').pop().replace(/\.svg$/, '');
      if (D.mockups.some((m) => m.name === name)) { a.setAttribute('href', '#/@mockups?m=' + name); return; }
    }
    if (docById[target]) { a.setAttribute('href', '#/' + target); return; }
    a.setAttribute('href', '#/' + (target || ''));
    a.classList.add('unresolved');
  });
}

/** Turn bare [OQ-nn] / [DEC-nn] / [AS-nn] / [F05] / [NFR-nn] text into chips. */
const CHIP_RE = /\[(OQ-\d{2}|DEC-\d{2}|AS-\d{2}|NFR-\d{2}|F\d{2}(?:-R\d{2})?)\]/g;
function chipify(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n) {
      if (!CHIP_RE.test(n.nodeValue)) return NodeFilter.FILTER_REJECT;
      CHIP_RE.lastIndex = 0;
      let p = n.parentElement;
      while (p && p !== root) {
        const t = p.tagName;
        if (t === 'A' || t === 'CODE' || t === 'PRE' || t === 'TH') return NodeFilter.FILTER_REJECT;
        p = p.parentElement;
      }
      return NodeFilter.FILTER_ACCEPT;
    },
  });
  const nodes = [];
  let n; while ((n = walker.nextNode())) nodes.push(n);
  for (const node of nodes) {
    const frag = document.createDocumentFragment();
    let last = 0; const s = node.nodeValue;
    s.replace(CHIP_RE, (m, ref, idx) => {
      if (idx > last) frag.appendChild(document.createTextNode(s.slice(last, idx)));
      const a = document.createElement('a');
      a.className = 'chip ' + (ref.startsWith('OQ') ? 'chip-oq' : ref.startsWith('DEC') ? 'chip-dec'
        : ref.startsWith('AS') ? 'chip-as' : ref.startsWith('NFR') ? 'chip-nfr' : 'chip-f');
      a.textContent = ref;
      a.href = ref.startsWith('OQ') ? '#/@questions?q=' + ref
        : (ref.startsWith('DEC') || ref.startsWith('AS')) ? '#/@decisions?r=' + ref
        : ref.startsWith('NFR') ? '#/20-architecture/08-non-functional-requirements'
        : featureHref(ref);
      frag.appendChild(a);
      last = idx + m.length;
      return m;
    });
    if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
    node.parentNode.replaceChild(frag, node);
  }
}
function featureHref(ref) {
  const code = ref.slice(0, 3);
  const f = D.features.find((x) => x.code === code);
  return f ? '#/' + f.id : '#/@features';
}

/* ── mermaid ───────────────────────────────────────────────────────── */
let mermaidReady = false;
function initMermaid() {

    startOnLoad: false,

    theme: 'base',

    // On screen we keep htmlLabels (the default): 27 of the 61 diagrams use <b>/<i>
    // inside labels and they read much better with it. Exports re-render the same
    // source with htmlLabels off — see portableRender() — because <foreignObject>
    // cannot be rasterised to PNG and does not open outside a browser.
    flowchart: { useMaxWidth: true },
    er: { useMaxWidth: true },
    themeVariables: dark ? {
      background:'#131c24', primaryColor:'#1a2a35', primaryTextColor:'#e6edf3', primaryBorderColor:'#2dd4bf',
      lineColor:'#64809a', secondaryColor:'#1e2b38', tertiaryColor:'#16212b',
      mainBkg:'#1a2a35', nodeBorder:'#3c5468', clusterBkg:'#101922', clusterBorder:'#2a3b49',
      titleColor:'#e6edf3', edgeLabelBackground:'#131c24', textColor:'#cbd5e1',
      actorBkg:'#1a2a35', actorBorder:'#2dd4bf', actorTextColor:'#e6edf3',
      signalColor:'#9fb0c0', signalTextColor:'#cbd5e1', labelBoxBkgColor:'#1a2a35',
      noteBkgColor:'#3a2c0d', noteTextColor:'#fbbf24', noteBorderColor:'#78591a',
      sectionBkgColor:'#16212b', altSectionBkgColor:'#101922', gridColor:'#2a3b49',
      taskBkgColor:'#1e3a44', taskTextColor:'#e6edf3', taskTextOutsideColor:'#cbd5e1',
      activeTaskBkgColor:'#0d9488', activeTaskBorderColor:'#2dd4bf',
      doneTaskBkgColor:'#1f3b2a', critBkgColor:'#4c1d1d', critBorderColor:'#f87171',
      todayLineColor:'#f87171',
    } : {
      background:'#ffffff', primaryColor:'#e8f5f3', primaryTextColor:'#0f172a', primaryBorderColor:'#0d9488',
      lineColor:'#7c8fa3', secondaryColor:'#eef2ff', tertiaryColor:'#f8fafc',
      mainBkg:'#e8f5f3', nodeBorder:'#7fbfb7', clusterBkg:'#f6f9fb', clusterBorder:'#dbe3ec',
      titleColor:'#0f172a', edgeLabelBackground:'#ffffff', textColor:'#334155',
      actorBkg:'#e8f5f3', actorBorder:'#0d9488', actorTextColor:'#0f172a',
      signalColor:'#5b6b7f', signalTextColor:'#334155', labelBoxBkgColor:'#e8f5f3',
      noteBkgColor:'#fef3c7', noteTextColor:'#92400e', noteBorderColor:'#fcd34d',
      sectionBkgColor:'#f8fafc', altSectionBkgColor:'#eef2f6', gridColor:'#dbe3ec',
      taskBkgColor:'#cbe9e5', taskTextColor:'#0f172a', taskTextOutsideColor:'#334155',
      activeTaskBkgColor:'#0d9488', activeTaskBorderColor:'#0f766e',
      doneTaskBkgColor:'#dcfce7', critBkgColor:'#fee2e2', critBorderColor:'#dc2626',
      todayLineColor:'#dc2626',
    },
  });
  mermaidReady = true;
}
async function runMermaid(root, ctx = {}) {
  const nodes = [...root.querySelectorAll('pre.mermaid')];
  if (!nodes.length) return;
  if (!mermaidReady) initMermaid();
  let n = 0;
  for (const el of nodes) {
    const src = el.dataset.src || el.textContent;
    el.dataset.src = src;
    n += 1;
    try {
      const id = 'mmd' + Math.random().toString(36).slice(2, 9);
      const { svg } = await mermaid.render(id, src);
      el.innerHTML = svg;
      el.removeAttribute('data-processed');
      decorateDiagram(el, ctx, n);
    } catch (e) {
      el.style.cursor = 'default';
      el.classList.add('dgm-failed');
      el.innerHTML = '<div class="dgm-err"><b>This diagram failed to render.</b> '
        + esc(String(e && e.message ? e.message.split('\n')[0] : e)) + '</div>'
        + '<pre style="text-align:left;margin:0;background:none;border:none;font-size:12px">'
        + esc(src) + '</pre>';
    }
  }
}

/** Nearest preceding heading, used to name the diagram and its export file. */
function nearestHeading(el) {
  let p = el.previousElementSibling;
  while (p) {
    if (/^H[1-4]$/.test(p.tagName)) return p.textContent.trim();
    p = p.previousElementSibling;
  }
  const h1 = el.closest('article')?.querySelector('h1');
  return h1 ? h1.textContent.trim() : 'Diagram';
}

function decorateDiagram(el, ctx, index) {
  const heading = nearestHeading(el);
  const docTitle = ctx.title || 'PeakPower';
  const meta = {
    title: heading,
    subtitle: docTitle,
    src: el.dataset.src,
    filename: `${(ctx.id || 'peakpower').split('/').pop()}-${index}-${slug(heading)}`,
  };
  const open = () => openViewer(el.querySelector('svg'), meta);

  const bar = document.createElement('div');
  bar.className = 'dgm-bar';
  bar.innerHTML = '<button class="dgm-btn" type="button">⤢ Expand</button>';
  bar.querySelector('button').addEventListener('click', (e) => { e.stopPropagation(); open(); });
  el.appendChild(bar);

  const hint = document.createElement('div');
  hint.className = 'dgm-hint';
  hint.textContent = 'click to enlarge';
  el.appendChild(hint);

  el.addEventListener('click', open);
  el.setAttribute('tabindex', '0');
  el.setAttribute('role', 'button');
  el.setAttribute('aria-label', `Open diagram full screen: ${heading}`);
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
  });
}

/* ── nav ───────────────────────────────────────────────────────────── */
function buildNav() {
  const nav = $('#nav');
  let html = '';
  for (const sec of D.sections) {
    const views = VIEWS.filter((v) => v.section === sec.key);
    const docs = D.docs.filter((d) => d.section === sec.key).sort(docSort);
    if (!views.length && !docs.length) continue;
    html += '<div class="navgroup"><div class="navgroup-h"><span>' + sec.icon + '</span>' + esc(sec.label) + '</div>';
    for (const v of views) {
      html += '<a class="navlink" data-id="' + v.id + '" href="#/' + v.id + '">' + esc(v.nav) + '</a>';
    }
    for (const d of docs) {
      const base = d.path.split('/').pop();
      const n = base.match(/^(F\d\d|\d\d)[-.]/);
      const label = d.title.replace(/^(F\d\d|[\d.]+)\s*—\s*/, '');
      html += '<a class="navlink" data-id="' + esc(d.id) + '" href="#/' + esc(d.id) + '">'
        + '<span class="n">' + (n ? n[1] : '') + '</span>'
        + '<span>' + esc(label) + '</span></a>';
    }
    html += '</div>';
  }
  nav.innerHTML = html;
  const s = D.stats;
  $('#navfoot').innerHTML = s.documents + ' documents · ' + s.words.toLocaleString('en-GB') + ' words<br>'
    + s.features + ' features · ' + s.requirements + ' requirements<br>'
    + s.diagrams + ' diagrams · ' + s.mockups + ' mockups<br>'
    + '<span style="color:#fbbf24">' + s.p1 + ' blocking questions</span> of ' + s.questions;
}
function markActive(id) {
  document.querySelectorAll('.navlink').forEach((a) => a.classList.toggle('active', a.dataset.id === id));
}

/* ── flat order for prev/next ──────────────────────────────────────── */
function flatOrder() {
  const out = [];
  for (const sec of D.sections) {
    VIEWS.filter((v) => v.section === sec.key).forEach((v) => out.push({ id: v.id, title: v.title }));
    D.docs.filter((d) => d.section === sec.key).sort(docSort)
      .forEach((d) => out.push({ id: d.id, title: d.title }));
  }
  return out;
}

/* ── renderers ─────────────────────────────────────────────────────── */
function renderDoc(doc) {
  const c = $('#content');
  c.className = 'content';
  c.innerHTML = '<div class="docwrap"><article class="doc" id="art"></article><aside class="toc" id="toc"></aside></div>';
  const art = $('#art');
  art.innerHTML = marked.parse(doc.md);
  resolveLinks(art, doc.dir);
  chipify(art);

  // TOC
  const hs = [...art.querySelectorAll('h2, h3')];
  $('#toc').innerHTML = hs.length
    ? '<div class="toc-h">On this page</div>' + hs.map((h) =>
      '<a class="' + h.tagName.toLowerCase() + '" href="#/' + doc.id + '#' + h.id + '">' + esc(h.textContent) + '</a>').join('')
    : '';

  // prev / next
  const order = flatOrder();
  const i = order.findIndex((o) => o.id === doc.id);
  const prev = i > 0 ? order[i - 1] : null;
  const next = i >= 0 && i < order.length - 1 ? order[i + 1] : null;
  const pager = document.createElement('div');
  pager.className = 'pager';
  pager.innerHTML = (prev ? '<a href="#/' + prev.id + '"><span>Previous</span>' + esc(prev.title) + '</a>' : '<span></span>')
    + (next ? '<a class="next" href="#/' + next.id + '"><span>Next</span>' + esc(next.title) + '</a>' : '<span></span>');
  art.appendChild(pager);

  $('#crumb').innerHTML = esc(doc.sectionLabel) + ' &nbsp;›&nbsp; <b>' + esc(doc.title) + '</b>';
  runMermaid(art, { id: doc.id, title: doc.title });
}

}

function stripMd(s) {
  return esc(String(s)).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/\[(OQ-\d\d|DEC-\d\d|AS-\d\d|F\d\d(?:-R\d\d)?|NFR-\d\d)\]/g,

    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
}

/* ── full-screen diagram / mockup viewer ───────────────────────────── */
const V = {
  el: $('#viewer'), stage: $('#vStage'), canvas: $('#vCanvas'),
  scale: 1, x: 0, y: 0, w: 0, h: 0, open: false, filename: 'diagram', bg: '#ffffff', src: null,
};

function toast(msg) {
  const t = $('#vToast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 1900);
}

/** Natural pixel size of an SVG, from viewBox where possible. */
function svgSize(svg) {
  const vb = (svg.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
  if (vb.length === 4 && vb[2] > 0 && vb[3] > 0) return { x: vb[0], y: vb[1], w: vb[2], h: vb[3] };
  const r = svg.getBoundingClientRect();
  return { x: 0, y: 0, w: r.width || 800, h: r.height || 600 };
}

/**
 * Standalone SVG string: explicit size, namespaces, and an opaque background so
 * the file does not come out transparent (dark text on nothing) when opened.
 */
function serialiseSvg(svg, bg) {
  const c = svg.cloneNode(true);
  const s = svgSize(svg);
  c.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  c.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
  c.setAttribute('width', s.w);
  c.setAttribute('height', s.h);
  c.setAttribute('viewBox', `${s.x} ${s.y} ${s.w} ${s.h}`);
  c.removeAttribute('style');
  if (bg) {
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    r.setAttribute('x', s.x); r.setAttribute('y', s.y);
    r.setAttribute('width', s.w); r.setAttribute('height', s.h);
    r.setAttribute('fill', bg);
    c.insertBefore(r, c.firstChild);
  }
  return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(c);
}

function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function hexRgb(h) {
  const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec((h || '').trim());
  return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : [255, 255, 255];
}

/**
 * Rasterise an SVG string to PNG via <img> + canvas.
 *
 * Chrome and Edge render <foreignObject> here correctly, so the export matches
 * the screen. Some engines silently drop it and hand back an empty canvas, so
 * the result is sampled for ink and reported as `blank` — the caller then
 * retries with a plain-<text> re-render rather than saving an empty image.
 */
async function rasterise(svgString, w, h, bg) {
  const scale = Math.max(2, Math.min(4, 3000 / Math.max(w, h)));  // ~3000px long edge
  const img = new Image();
  await new Promise((res, rej) => {
    img.onload = res;
    img.onerror = () => rej(new Error('the browser could not load the SVG for rasterising'));
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
  });
  const cv = document.createElement('canvas');
  cv.width = Math.round(w * scale); cv.height = Math.round(h * scale);
  const ctx = cv.getContext('2d');
  ctx.drawImage(img, 0, 0, cv.width, cv.height);

  const [br, bgn, bb] = hexRgb(bg);
  const d = ctx.getImageData(0, 0, cv.width, cv.height).data;
  let ink = 0;
  for (let i = 0; i < d.length && ink <= 12; i += 4 * 613) {
    if (Math.abs(d[i] - br) > 24 || Math.abs(d[i + 1] - bgn) > 24 || Math.abs(d[i + 2] - bb) > 24) ink++;
  }
  const blob = await new Promise((r) => cv.toBlob(r, 'image/png'));
  if (!blob) throw new Error('toBlob returned null');
  return { blob, blank: ink <= 12 };
}

function applyTransform() {
  V.canvas.style.transform = `translate(${V.x}px, ${V.y}px) scale(${V.scale})`;
  $('#vZoom').textContent = Math.round(V.scale * 100) + '%';
}

function fitToStage(pad = 0.94) {
  const r = V.stage.getBoundingClientRect();
  V.scale = Math.min(r.width / V.w, r.height / V.h) * pad;
  V.x = (r.width - V.w * V.scale) / 2;
  V.y = (r.height - V.h * V.scale) / 2;
  applyTransform();
}

function zoomAt(factor, cx, cy) {
  const next = Math.min(12, Math.max(0.05, V.scale * factor));
  const r = V.stage.getBoundingClientRect();
  const px = (cx ?? r.width / 2) - V.x;
  const py = (cy ?? r.height / 2) - V.y;
  V.x -= px * (next / V.scale - 1);
  V.y -= py * (next / V.scale - 1);
  V.scale = next;
  applyTransform();
}

/** Zoom to 100% about the centre of the stage. */
function actualSize() { zoomAt(1 / V.scale); }

/**
 * Re-render a diagram with htmlLabels off, so it exports as real <text>.
 * <foreignObject> cannot be rasterised by canvas and does not open in
 * Illustrator, Inkscape or Figma. Cached per source string.
 */
const exportCache = new Map();
async function portableRender(src) {
  if (exportCache.has(src)) return exportCache.get(src);
  const cleaned = src.replace(/<\/?(b|strong|i|em)>/gi, '');
  const directive = '%%{init: {"flowchart":{"htmlLabels":false},'
    + '"class":{"htmlLabels":false},"state":{"htmlLabels":false}}}%%\n';
  const id = 'exp' + Math.random().toString(36).slice(2, 9);
  const { svg } = await mermaid.render(id, directive + cleaned);
  const holder = document.createElement('div');
  holder.innerHTML = svg;
  const el = holder.querySelector('svg');
  const s = svgSize(el);
  const out = { el, w: s.w, h: s.h };
  exportCache.set(src, out);
  return out;
}

/** What is on screen — the highest-fidelity source, used first for every export. */
function displayTarget() { return { el: currentSvg(), w: V.w, h: V.h }; }

/** Plain-<text> fallback, only used when the browser cannot rasterise the above. */
async function fallbackTarget() {
  if (!V.src) return null;
  try {
    const r = await portableRender(V.src);
    return r.el ? r : null;
  } catch (e) {
    console.warn('portable re-render failed', e);
    return null;
  }
}

/**
 * @param {SVGElement} svg     source element (not mutated)
 * @param {object} meta        { title, subtitle, filename }
 */
function openViewer(svg, meta = {}) {
  if (!svg) return;
  V.src = meta.src || null;
  const clone = svg.cloneNode(true);
  const s = svgSize(svg);
  clone.removeAttribute('style');
  clone.setAttribute('width', s.w);
  clone.setAttribute('height', s.h);

  V.w = s.w; V.h = s.h;
  V.filename = (meta.filename || 'diagram').replace(/[^\w.-]+/g, '-').replace(/^-|-$/g, '').slice(0, 80);
  V.bg = getComputedStyle(document.documentElement).getPropertyValue('--panel').trim() || '#ffffff';
  V.canvas.innerHTML = '';
  V.canvas.appendChild(clone);
  $('#vTitle').textContent = meta.title || 'Diagram';
  $('#vSub').textContent = (meta.subtitle ? meta.subtitle + ' · ' : '') + `${Math.round(s.w)} × ${Math.round(s.h)} px`;
  V.el.classList.add('on');
  V.open = true;
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => fitToStage());
}

function closeViewer() {
  V.el.classList.remove('on');
  V.open = false;
  V.canvas.innerHTML = '';
  document.body.style.overflow = '';
}

function currentSvg() { return V.canvas.querySelector('svg'); }

$('#vClose').onclick = closeViewer;
$('#vIn').onclick  = () => zoomAt(1.25);
$('#vOut').onclick = () => zoomAt(1 / 1.25);
$('#vFit').onclick = () => fitToStage();
$('#vOne').onclick = actualSize;

async function withBusy(btn, label, fn) {
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = label;
  try { await fn(); } finally { btn.disabled = false; btn.textContent = original; }
}

$('#vSvg').onclick = (e) => withBusy(e.currentTarget, 'Preparing…', async () => {
  const t = displayTarget(); if (!t.el) return;
  download(new Blob([serialiseSvg(t.el, V.bg)], { type: 'image/svg+xml;charset=utf-8' }),
    V.filename + '.svg');
  toast('SVG downloaded');
});

$('#vPng').onclick = (e) => withBusy(e.currentTarget, 'Rendering…', async () => {
  const t = displayTarget(); if (!t.el) return;
  try {
    let out = await rasterise(serialiseSvg(t.el, V.bg), t.w, t.h, V.bg);
    if (out.blank) {
      // This engine dropped <foreignObject>. Retry with a plain-<text> render.
      const fb = await fallbackTarget();
      if (fb) {
        const retry = await rasterise(serialiseSvg(fb.el, V.bg), fb.w, fb.h, V.bg);
        if (!retry.blank) { download(retry.blob, V.filename + '.png'); toast('PNG downloaded'); return; }
      }
      toast('PNG came out empty — use SVG instead');
      return;
    }
    download(out.blob, V.filename + '.png');
    toast('PNG downloaded');
  } catch (err) {
    console.error('PNG export failed:', err);
    toast('PNG failed — use SVG instead');
  }
});

$('#vTab').onclick = (e) => withBusy(e.currentTarget, 'Opening…', async () => {
  const t = displayTarget(); if (!t.el) return;
  const blob = new Blob([serialiseSvg(t.el, V.bg)], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const win = window.open(url, '_blank', 'noopener');
  if (!win) { download(blob, V.filename + '.svg'); toast('Pop-up blocked — downloaded instead'); }
  setTimeout(() => URL.revokeObjectURL(url), 60000);
});

// wheel to zoom, drag to pan, double-click to fit
V.stage.addEventListener('wheel', (e) => {
  if (!V.open) return;
  e.preventDefault();
  const r = V.stage.getBoundingClientRect();
  zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

let drag = null;
V.stage.addEventListener('pointerdown', (e) => {
  if (!V.open) return;
  drag = { px: e.clientX, py: e.clientY, x: V.x, y: V.y };
  V.stage.setPointerCapture(e.pointerId);
  V.stage.classList.add('grabbing');
});
V.stage.addEventListener('pointermove', (e) => {
  if (!drag) return;
  V.x = drag.x + (e.clientX - drag.px);
  V.y = drag.y + (e.clientY - drag.py);
  applyTransform();
});
const endDrag = () => { drag = null; V.stage.classList.remove('grabbing'); };
V.stage.addEventListener('pointerup', endDrag);
V.stage.addEventListener('pointercancel', endDrag);
V.stage.addEventListener('dblclick', () => fitToStage());

function openMockupViewer(name) {
  const m = D.mockups.find((x) => x.name === name); if (!m) return;
  const holder = document.createElement('div');

}

/* ── search ────────────────────────────────────────────────────────── */
function runSearch(term) {
  const c = $('#content'); c.className = 'content';
  const t = term.toLowerCase();
  const hits = [];
  for (const d of D.docs) {
    const low = d.md.toLowerCase();
    let score = 0;
    if (d.title.toLowerCase().includes(t)) score += 50;
    const idx = low.indexOf(t);
    if (idx === -1 && score === 0) continue;
    const count = low.split(t).length - 1;
    score += count;
    const at = idx === -1 ? 0 : idx;
    let snip = d.md.slice(Math.max(0, at - 90), at + 190).replace(/\s+/g, ' ').trim();
    snip = esc(snip).replace(new RegExp(esc(term).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), (x) => '<mark>' + x + '</mark>');
    hits.push({ d, score, snip, count });
  }
  hits.sort((a, b) => b.score - a.score);
  c.innerHTML = `<h1 class="doc" style="font-size:26px;margin:0 0 6px">Search</h1>
  <p style="color:var(--muted);margin:0 0 20px">${hits.length} document${hits.length === 1 ? '' : 's'} matching “${esc(term)}”</p>
  <div class="searchres">${hits.map((h) => `<a class="sres" href="#/${h.d.id}">
    <div class="sc">${esc(h.d.sectionLabel)} · ${h.count} match${h.count === 1 ? '' : 'es'}</div>
    <div class="st">${esc(h.d.title)}</div><div class="sn">…${h.snip}…</div></a>`).join('')
    || '<p style="color:var(--muted)">Nothing found.</p>'}</div>`;
  $('#crumb').innerHTML = '<b>Search</b>';
}

/* ── routing ───────────────────────────────────────────────────────── */
function route() {
  const raw = location.hash.replace(/^#\/?/, '');
  const [pathAndQuery, anchor] = raw.split('#');
  const [path, query] = pathAndQuery.split('?');
  const params = new URLSearchParams(query || '');
  const id = decodeURIComponent(path || '@home');

  if (V.open) closeViewer();
  markActive(id);

  if (id === '@home' || id === '') viewHome();
  else if (id === '@features') viewFeatures();
  else if (id === '@questions') viewQuestions(params);
  else if (id === '@risks') viewRisks();
  else if (id === '@decisions') viewDecisions(params);
  else if (id === '@mockups') viewMockups(params);
  else if (docById[id]) renderDoc(docById[id]);
  else {
    $('#content').className = 'content';
    $('#content').innerHTML = '<h1 class="doc">Not found</h1><p style="color:var(--muted)">No document with the id <code>'
      + esc(id) + '</code>.</p><p><a href="#/@home">Back to the overview</a></p>';
    $('#crumb').innerHTML = '<b>Not found</b>';
  }

  if (anchor) {
    setTimeout(() => { const el = document.getElementById(anchor); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60);
  } else {
    window.scrollTo(0, 0);
  }
}

/* ── theme ─────────────────────────────────────────────────────────── */
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('pp-theme', t); } catch (e) { /* private mode */ }
  $('#themeBtn').textContent = t === 'dark' ? 'Light' : 'Dark';
  mermaidReady = false;
  // Re-render every diagram in the new theme, keeping filenames/labels consistent.
  document.querySelectorAll('pre.mermaid').forEach((el) => {
    if (el.dataset.src) el.innerHTML = '';
  });
  const cur = docById[(location.hash.replace(/^#\/?/, '').split('?')[0].split('#')[0]) || ''];
  runMermaid(document, cur ? { id: cur.id, title: cur.title } : {});
}
$('#themeBtn').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
$('#printBtn').onclick = () => window.print();

let stored = null;
try { stored = localStorage.getItem('pp-theme'); } catch (e) { /* private mode */ }
setTheme(stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

/* ── search box ────────────────────────────────────────────────────── */
let searchTimer;
$('#q').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  const v = e.target.value.trim();
  searchTimer = setTimeout(() => { if (v.length >= 2) runSearch(v); else if (!v) route(); }, 180);
});
addEventListener('keydown', (e) => {
  if (V.open) {
    if (e.key === 'Escape') { e.preventDefault(); closeViewer(); return; }
    if (e.key === '+' || e.key === '=') { e.preventDefault(); zoomAt(1.25); return; }
    if (e.key === '-' || e.key === '_') { e.preventDefault(); zoomAt(1 / 1.25); return; }
    if (e.key === '0') { e.preventDefault(); fitToStage(); return; }
    if (e.key === '1') { e.preventDefault(); actualSize(); return; }
    if (e.key.startsWith('Arrow')) {
      e.preventDefault();
      const step = e.shiftKey ? 120 : 40;
      if (e.key === 'ArrowLeft')  V.x += step;
      if (e.key === 'ArrowRight') V.x -= step;
      if (e.key === 'ArrowUp')    V.y += step;
      if (e.key === 'ArrowDown')  V.y -= step;
      applyTransform(); return;
    }
    return;   // swallow other keys while the viewer is open
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); $('#q').focus(); $('#q').select(); }
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT') {
    e.preventDefault(); $('#q').focus();
  }
});

/* ── go ────────────────────────────────────────────────────────────── */
buildNav();
addEventListener('hashchange', route);
route();
})();
</script>
</body>
